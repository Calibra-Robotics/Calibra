# Reusable workflow: Calibra dataset quality gate.
#
# Call this from any robotics repo to add a Calibra certification gate:
#
#   jobs:
#     data-quality:
#       uses: Calibra-Robotics/Calibra/.github/workflows/certify.yml@main
#       with:
#         dataset: ./demos
#         reference: aloha
#         policy: diffusion
#
# Or inline usage example (copy into your own workflow):
#
#   - name: Certify dataset
#     uses: Calibra-Robotics/Calibra/.github/actions/certify@main
#     with:
#       dataset: ./demos
#       reference: aloha

name: Calibra Dataset Certification

on:
  workflow_call:
    inputs:
      dataset:
        description: "Path or HF Hub ID of the dataset to certify"
        required: true
        type: string
      reference:
        description: "Reference profile (e.g. aloha, pusht)"
        required: false
        type: string
        default: ""
      policy:
        description: "Policy family (e.g. diffusion, act, pi0, gr00t)"
        required: false
        type: string
        default: ""
      format:
        description: "Format adapter (hdf5, lerobot, isaac_lab, rlds, mcap)"
        required: false
        type: string
        default: ""
      strict:
        description: "Fail on warnings too"
        required: false
        type: boolean
        default: false
      python-version:
        description: "Python version to use"
        required: false
        type: string
        default: "3.11"

    outputs:
      grade:
        description: "Certification grade"
        value: ${{ jobs.certify.outputs.grade }}
      score:
        description: "Calibra Score (0–100)"
        value: ${{ jobs.certify.outputs.score }}

jobs:
  certify:
    name: Calibra Dataset Quality Gate
    runs-on: ubuntu-latest
    outputs:
      grade: ${{ steps.certify.outputs.grade }}
      score: ${{ steps.score.outputs.score }}

    steps:
      # A called workflow starts in a fresh job, so a local dataset path only
      # exists after checking out the caller's repository.
      - name: Check out caller repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install Calibra
        run: |
          pip install "calibra-robotics[hdf5,lerobot,kinematics]" --quiet
          calibra --version

      # Inputs reach the scripts through env, never ${{ }} interpolation, so a
      # dataset path or argument cannot inject shell commands.
      - name: Run calibra certify
        id: certify
        env:
          DATASET: ${{ inputs.dataset }}
          REFERENCE: ${{ inputs.reference }}
          POLICY: ${{ inputs.policy }}
          FORMAT: ${{ inputs.format }}
          STRICT: ${{ inputs.strict }}
        run: |
          args=("$DATASET")
          if [ -n "$REFERENCE" ]; then args+=(--reference "$REFERENCE"); fi
          if [ -n "$POLICY" ]; then args+=(--policy "$POLICY"); fi
          if [ -n "$FORMAT" ]; then args+=(--format "$FORMAT"); fi
          if [ "$STRICT" = "true" ]; then args+=(--strict); fi

          # set +e so the real exit code survives (run steps use bash -e).
          JSON_FILE="$RUNNER_TEMP/calibra-certify.json"
          set +e
          calibra certify "${args[@]}" --json > "$JSON_FILE"
          EXIT_CODE=$?
          set -e
          calibra certify "${args[@]}" || true

          GRADE=$(python3 -c \
            "import sys,json; print(json.load(open(sys.argv[1])).get('grade','UNKNOWN'))" \
            "$JSON_FILE" 2>/dev/null || echo "UNKNOWN")
          echo "grade=$GRADE" >> "$GITHUB_OUTPUT"
          echo "::notice title=Calibra::Grade: $GRADE"
          # Exit 1 (warnings) only fails when strict, and --strict already
          # turns it into 2.
          if [ "$EXIT_CODE" -ge 2 ]; then exit "$EXIT_CODE"; fi

      - name: Run calibra score
        id: score
        if: always()
        env:
          DATASET: ${{ inputs.dataset }}
          POLICY: ${{ inputs.policy }}
          FORMAT: ${{ inputs.format }}
        run: |
          args=("$DATASET")
          if [ -n "$FORMAT" ]; then args+=(--format "$FORMAT"); fi
          if [ -n "$POLICY" ]; then args+=(--policy "$POLICY"); fi

          JSON=$(calibra score "${args[@]}" --json 2>/dev/null) || true
          SCORE=$(echo "$JSON" | python3 -c \
            "import sys,json; print(json.load(sys.stdin).get('total_score','n/a'))" 2>/dev/null \
            || echo "n/a")
          echo "score=$SCORE" >> "$GITHUB_OUTPUT"
          echo "::notice title=Calibra Score::$SCORE / 100"
