injector = "duplicate_exact"
params = { frac = 0.15 }
family = "duplicate_episode"
tier = "clear"

[[variants]]
id = "dup.reencoded"
injector = "duplicate_reencoded"
family = "duplicate_episode"
tier = "clear"
reencode = true

[[variants]]
id = "dup.ulp"
injector = "duplicate_ulp"
