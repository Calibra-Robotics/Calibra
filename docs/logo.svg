<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 100">
  <!--
    Calibra horizontal lockup, 480x100.
    Monochrome "Calibra" wordmark in IBM Plex Sans, matching the website
    favicon (web/public/favicon.svg) and the brand/linkedin assets.
  -->
  <rect width="480" height="100" rx="16" fill="#0a0a0a"/>
  <text x="240" y="48" text-anchor="middle" dominant-baseline="central"
        font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-weight="700" font-size="44" letter-spacing="-1.2" fill="#f2f2f0">Calibra</text>
  <text x="240" y="80" text-anchor="middle" dominant-baseline="central"
        font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-weight="400" font-size="13" letter-spacing="0.3" fill="#8a8a86">dataset observability for robotics</text>
</svg>
