name: Dataset Profile Proposal
description: Calibra misjudges a dataset you know; propose a profile with measurements
title: "[PROFILE]: "
labels: ["dataset-profile"]
body:
  - type: markdown
    attributes:
      value: |
        A dataset profile changes Calibra's defaults for one dataset. Profiles are
        merged only with evidence: every field below ends up in the profile's
        `ProfileEvidence` record. See docs/contributing.md for the standard and the
        PushT profile in `calibra/dataset_profiles.py` for a worked example.
  - type: input
    id: dataset
    attributes:
      label: Dataset and revision
      description: Hub ID plus the commit SHA or tag you measured.
      placeholder: lerobot/droid_100 @ 3f2a9c1
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Collection setup
      description: Robot, teleop method, sim or hardware, sampling rate.
    validations:
      required: true
  - type: textarea
    id: action-space
    attributes:
      label: Action space
      description: What each action dimension means, absolute or delta, units, which dims (if any) are grippers.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What Calibra gets wrong
      description: The verdict, flag or prune result that is wrong for this dataset, and how you know the data is clean.
    validations:
      required: true
  - type: textarea
    id: baseline
    attributes:
      label: Clean baseline and detector firing rates
      description: Per-episode distributions (mean, p95, max) for the metrics involved, on data you believe is clean.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed settings and justification
      description: The thresholds or gripper dims you propose and why each value, not only that the default is wrong.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction command
      description: The exact command that produced your numbers, including Calibra version and seeds.
      render: shell
    validations:
      required: true
