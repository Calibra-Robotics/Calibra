name: CLA

# Contributors sign CLA.md once by commenting on their pull request.
# Signatures are stored on the unprotected `cla-signatures` branch, one file
# per CLA version. When CLA.md changes materially, bump its version and point
# path-to-signatures at a new file, so everyone signs the new text.
# pull_request_target is safe here: this job never checks out PR code.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA Assistant
    runs-on: ubuntu-latest
    steps:
      - if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/Calibra-Robotics/Calibra/blob/main/CLA.md
          path-to-signatures: signatures/cla-v1.json
          branch: cla-signatures
          allowlist: omertt27,dependabot[bot],Copilot
