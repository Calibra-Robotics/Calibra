version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    # Calibra is a library: never raise a `>=` floor just because a newer
    # release exists, which would force every user to upgrade. Only exact
    # pins (e.g. mypy in the dev extra) get bumped.
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 5
