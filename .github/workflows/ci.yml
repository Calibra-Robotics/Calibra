name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format Check
        run: ruff format --check .

      # One Python version only: the error count depends on the environment.
      - name: Type check (ratchet)
        if: matrix.python-version == '3.12'
        run: python scripts/mypy_ratchet.py

      - name: Verify Claims Documentation Ratio
        run: python scripts/generate_claims_doc.py --check

      - name: Test
        run: pytest tests/ -v --tb=short --ignore=tests/regression --cov=calibra --cov-report=term-missing --cov-report=xml

      # Verdicts and prune decisions on frozen real PushT data. A failure means a
      # change moved Calibra's decisions; see tests/regression/test_benchmark_regression.py.
      - name: Benchmark regression
        run: pytest tests/regression -v --tb=short

  # ADR-012: what goes to PyPI is the Apache core only, and it runs on its own.
  core-dist:
    name: Core distribution excludes ee/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: pip install build && python -m build

      - name: No ee/ files in either artifact
        run: |
          if unzip -l dist/*.whl | grep -E '\see/|calibra_ee'; then exit 1; fi
          if tar tzf dist/*.tar.gz | grep -E '/ee/|calibra_ee'; then exit 1; fi

      - name: Wheel works without calibra_ee
        run: |
          python -m venv /tmp/core
          /tmp/core/bin/pip install dist/*.whl
          /tmp/core/bin/calibra --version
          /tmp/core/bin/python -c "import calibra.plugins as p; assert not p.get_registry().commands"
          /tmp/core/bin/calibra whoami && exit 1 || test $? -eq 2

  ee:
    name: ee/ extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install core and extension
        run: pip install -e ".[dev]" -e ee/

      - name: Test
        run: pytest ee/tests -v --tb=short
