# Integrity fault-injection benchmark configuration (PROTOCOL.md).
# Tiers are pre-registered here; do not edit them after a scored run without a
# PROTOCOL.md changelog entry.

calibra_version = "0.13.0"

[datasets.h1]
repo = "lerobot/unitreeh1_rearrange_objects"
revision = "e874d89b9024bad414deb45d7da82fa93601c260"
root = "data/unitreeh1_rearrange_objects"
# Native acquisition faults from eval/real_faults (extra-copy convention).
native_faults = [{ episode = 26, check = "duplicate_episode_fraction" }]

[datasets.aloha]
repo = "lerobot/aloha_static_battery"
revision = "06dc3da83c4fd3d1889b00f1dfd3780da8421f64"
root = "data/aloha_static_battery"
native_faults = []

[datasets.pusht]
repo = "lerobot/pusht"
revision = "7628202a2180972f291ba1bc6723834921e72c19"
root = "pusht"
native_faults = []

# Thresholds as documented in PROTOCOL.md section 4. run.py compares each one to
# the Calibra source and refuses to run if any differs.
[thresholds]
duplicate_frame_rate = { warning = 0.05, critical = 0.15 }
camera_freeze_events = { warning = 1e-9, critical = 0.10, min_run = 5 }
timestamp_dropout_rate = { warning = 0.01, critical = 0.05, gap_k = 3.0 }
timestamp_jitter_cv = { warning = 0.15, critical = 0.30 }
video_frame_mismatch_rate = { frame_tolerance = 1 }
video_fps_mismatch_rate = { rel_tolerance = 0.01 }

[reps]
default = 10
reencode = 5   # variants that re-encode video

# One entry per (variant, severity). `decode`: run the decoded-video pass
# (needed only when frame content changes). `reencode`: uses the reencode rep count.
# Tiers, relative to the check's first (WARNING or zero-tolerance) threshold:
#   sub < 1x, near 1x-1.5x, clear >= 2x (or any instance of a zero-tolerance
#   fault), by_design (outside what the check is built to see), ambiguous, control.
# Recall counts any non-OK flag from the expected check; whether the level is
# the expected one is scored separately (severity agreement).

# ── controls ────────────────────────────────────────────────────────────────
[[variants]]
id = "clean.copy"
injector = "identity"
family = "control"
tier = "control"
decode = true
reps = 1

[[variants]]
id = "clean.reencode"
reps = 2
injector = "reencode_control"
family = "control"
tier = "control"
decode = true
reencode = true

[[variants]]
id = "clean.append"
injector = "append_control"
family = "control"
tier = "control"

# ── 5.1 duplicate episodes ──────────────────────────────────────────────────
[[variants]]
id = "dup.exact.1"
injector = "duplicate_exact"
params = { count = 1 }
family = "duplicate_episode"
tier = "clear"

[[variants]]
