name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format Check
        run: ruff format --check .

      - name: Verify Claims Documentation Ratio
        run: python scripts/generate_claims_doc.py --check

      - name: Test
        run: pytest tests/ -v --tb=short --ignore=tests/regression --cov=calibra --cov-report=term-missing --cov-report=xml

      # Verdicts and prune decisions on frozen real PushT data. A failure means a
      # change moved Calibra's decisions; see tests/regression/test_benchmark_regression.py.
      - name: Benchmark regression
        run: pytest tests/regression -v --tb=short

